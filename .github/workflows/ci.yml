name: CI/CD

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:
  schedule:
    # Weekly schedule for regression detection (+ Node 22 matrix)
    - cron: '0 2 * * 1'

# Default least privilege; deploy job elevates Pages permissions.
permissions:
  contents: read

# Cancel superseded PR/workflow runs; keep main deploys serial (no cancel).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: '24.0.0'
  NPM_CACHE_VERSION: '3'
  PLAYWRIGHT_CACHE_VERSION: '1'

jobs:
  # =======================================================================
  # LINT & TYPE CHECK (blocking, parallel with unit tests)
  # =======================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs history

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-version: ${{ env.NPM_CACHE_VERSION }}

      - name: Cache TypeScript incremental build info
        uses: actions/cache@v6
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsbuild-${{ env.NPM_CACHE_VERSION }}-${{ hashFiles('tsconfig.json') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tsbuild-${{ env.NPM_CACHE_VERSION }}-

      - name: Run ESLint (with cache)
        run: npm run lint -- --cache --max-warnings=0

      - name: Run TypeScript type check
        id: tsc-check
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc-output.txt

      - name: TypeScript errors summary
        if: always()
        run: |
          if [ -f tsc-output.txt ]; then
            ERROR_COUNT=$(grep -c "error TS" tsc-output.txt || true)
          else
            ERROR_COUNT=0
          fi
          {
            echo "## TypeScript"
            echo "Errors: $ERROR_COUNT"
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo ""
              echo '```'
              grep "error TS" tsc-output.txt | head -20 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Commitlint (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=50
          # Local configs exist; @commitlint/config-conventional via npx peer
          npm install --no-save --legacy-peer-deps \
            @commitlint/cli@19 @commitlint/config-conventional@19
          npx commitlint --from origin/main --to HEAD --verbose

  # =======================================================================
  # UNIT TESTS (blocking; Node 24 on PR/push, 22+24 on weekly schedule)
  # =======================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'schedule' && '["22","24"]' || '["24"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node-version }}
          cache-version: ${{ env.NPM_CACHE_VERSION }}

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt
        timeout-minutes: 25

      - name: Coverage report to summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const p = "coverage/lcov.info";
            if (!fs.existsSync(p)) { console.log("no lcov.info produced"); process.exit(0); }
            const t = fs.readFileSync(p, "utf8");
            let lf = 0, lh = 0, brf = 0, brh = 0;
            for (const m of t.matchAll(/^LF:(\d+)/gm)) lf += +m[1];
            for (const m of t.matchAll(/^LH:(\d+)/gm)) lh += +m[1];
            for (const m of t.matchAll(/^BRF:(\d+)/gm)) brf += +m[1];
            for (const m of t.matchAll(/^BRH:(\d+)/gm)) brh += +m[1];
            const lp = lf ? (lh / lf * 100).toFixed(1) : "n/a";
            const bp = brf ? (brh / brf * 100).toFixed(1) : "n/a";
            const s = "## Coverage Summary (Node ${{ matrix.node-version }})\n" +
                      "- Lines: " + lp + "% (" + lh + "/" + lf + ")\n" +
                      "- Branches: " + bp + "% (" + brh + "/" + brf + ")\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, s);
            console.log(s);
          '

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

      - name: Run fuzz tests
        run: npm test tests/fuzz/fuzz.test.ts

      - name: Test summary
        if: always()
        run: |
          TEST_COUNT=$(grep -oE 'Tests +[0-9]+ passed' test-output.txt 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo "unknown")
          {
            echo "## Test Summary (Node ${{ matrix.node-version }})"
            echo "Tests run: $TEST_COUNT"
            echo "Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # =======================================================================
  # PRODUCTION BUILD (blocking — required for deploy + e2e artifact)
  # =======================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-version: ${{ env.NPM_CACHE_VERSION }}

      - name: Cache Vite build cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ env.NPM_CACHE_VERSION }}-${{ hashFiles('package-lock.json', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ env.NPM_CACHE_VERSION }}-

      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist directory not created"
            exit 1
          fi
          echo "Build size:"
          du -sh dist/
          find dist -name "*.js" -exec wc -c {} \; | sort -rn | head -5

      - name: Build summary + budget
        if: always()
        run: |
          if [ ! -d dist ]; then
            echo "No dist/ — build failed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          JS_SIZE=$(find dist -name "*.js" -exec wc -c {} + | tail -1 | awk '{print $1}')
          CSS_SIZE=$(find dist -name "*.css" -exec wc -c {} + | tail -1 | awk '{print $1}')
          {
            echo "## Build Summary"
            echo "Dist size: $(du -sh dist/ | cut -f1)"
            echo "JS: $((JS_SIZE / 1024)) KB"
            echo "CSS: $((CSS_SIZE / 1024)) KB"
          } >> "$GITHUB_STEP_SUMMARY"

          # Soft budget (warning only): 3D + engine routinely ~1.8 MB.
          MAX_SIZE=$((2000 * 1024))
          if [ "$TOTAL_SIZE" -gt "$MAX_SIZE" ]; then
            {
              echo "⚠️ Bundle exceeds 2000 KB budget — review chunk growth"
              echo "Top chunks:"
              find dist/assets -name "*.js" -exec wc -c {} + | sort -rn | head -10 \
                | awk '{printf "  %s: %d KB\n", $2, $1/1024}'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Bundle size within budget ($((TOTAL_SIZE / 1024)) KB <= 2000 KB)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # =======================================================================
  # REQUIRED GATE (single status check for branch protection)
  # =======================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test, build, e2e-test]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Require lint + test + build success
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          fail=0
          [ "${{ needs.lint.result }}" = "success" ] || fail=1
          [ "${{ needs.test.result }}" = "success" ] || fail=1
          [ "${{ needs.build.result }}" = "success" ] || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "❌ Required jobs failed — CI gate closed"
            exit 1
          fi
          echo "✅ CI gate open (lint + test + build + e2e)"

  # =======================================================================
  # E2E TESTS (Playwright) — blocking (retries=2 + parallel workers absorb flake)
  # =======================================================================
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [build]
    # Blocking: flaky tests are absorbed by retries=2 + 2 workers; a red E2E
    # must not deploy (required status check is only honest if the job can fail).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-version: ${{ env.NPM_CACHE_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_CACHE_VERSION }}-

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright Chromium present (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=github
        timeout-minutes: 60
        env:
          CI: true

      - name: E2E test summary
        if: always()
        run: |
          {
            echo "## E2E Test Summary"
            echo "Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Visual Regression tests
        continue-on-error: true
        run: npm run test:visual
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  # =======================================================================
  # SECURITY & DEPENDENCY AUDIT (non-blocking)
  # =======================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-version: ${{ env.NPM_CACHE_VERSION }}

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --omit=dev --json > audit-report.json || true
          {
            echo "## Security Audit Summary"
            jq -r '.metadata.vulnerabilities | to_entries[] | "\(.key): \(.value)"' audit-report.json \
              || echo "(could not parse audit report)"
          } | tee audit-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check for outdated packages
        run: |
          npx npm-check-updates -f '/^[^@]/' --rejected --timeout 10000 > outdated.txt || true
          cat outdated.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit-report
          path: |
            audit-report.json
            audit-summary.txt
            outdated.txt
          retention-days: 7
          if-no-files-found: ignore

  # =======================================================================
  # LIGHTHOUSE (against built dist/) — non-blocking
  # =======================================================================
  lighthouse:
    name: Lighthouse (Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-version: ${{ env.NPM_CACHE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/

      - name: Serve built site (background)
        run: nohup npx http-server dist -p 5050 -s > /tmp/http-server.log 2>&1 & disown

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5050/ >/dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start"; cat /tmp/http-server.log
          exit 1

      - name: Lighthouse CI (Performance Budget)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:5050/
          budgetPath: .github/lighthouse-ci.json
          uploadArtifacts: true

      - name: Lighthouse summary
        if: always()
        run: |
          {
            echo "## Lighthouse Summary (built dist/)"
            echo "Status: ${{ job.status }} (see uploaded artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  # =======================================================================
  # DEPLOY TO GITHUB PAGES (main only, after successful build)
  # =======================================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [e2e-test, ci-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo "Status: ${{ job.status }}"
            echo "URL: ${{ steps.deployment.outputs.page_url }}"
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
